name: Profile stats

# Redraws assets/stats.svg from the GitHub API. Add a personal access token
# (classic, scopes: repo + read:user) as the STATS_TOKEN repository secret so
# private repos and contributions are counted; without it only public work shows.

on:
  schedule:
    - cron: "17 4 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "design/**"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install font tools
        run: pip install fonttools brotli

      - name: Render stats card
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_LOGIN: ${{ github.repository_owner }}
        run: python3 design/stats.py

      - name: Commit if the numbers changed
        run: |
          if git diff --quiet -- assets/stats.svg; then
            echo "Stats unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git commit -m "Refresh profile stats"
          git push
